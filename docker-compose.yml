services:
  nginx:
    image: nginx:alpine
    container_name: lean4web-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - lean4web
    command: >
      /bin/sh -c '
        # Check for reload signal every 5 seconds (for initial cert)
        while :; do
          if [ -f /var/www/certbot/.reload-nginx ]; then
            echo "Reload signal received, reloading nginx..."
            nginx -s reload
            rm -f /var/www/certbot/.reload-nginx
          fi
          sleep 5
        done &
        # Reload every 6 hours (for renewals)
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        nginx -g "daemon off;"
      '

  certbot:
    image: certbot/certbot
    container_name: lean4web-certbot
    restart: always
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./init-letsencrypt.sh:/init-letsencrypt.sh:ro
    entrypoint: "/bin/sh /init-letsencrypt.sh"
    depends_on:
      - nginx

  lean4web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: lean4web:latest
    container_name: lean4web
    restart: always

    # Security settings required for Bubblewrap sandboxing
    # Bubblewrap needs full namespace support to mount /proc inside its sandbox.
    # These settings are required for this to work reliably on Linux.
    # Note: Bubblewrap itself provides sandboxing (no network, isolated PID, read-only fs)
    privileged: true
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN

    expose:
      - "8080"

    environment:
      - NODE_ENV=production
      - PORT=8080
      # Uncomment to disable Bubblewrap sandboxing (NOT recommended for production)
      # - ALLOW_NO_BUBBLEWRAP=true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  certbot-etc:
  certbot-var:
  certbot-webroot:
