services:
  nginx:
    image: nginx:alpine
    container_name: lean4web-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lean4web

  lean4web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: lean4web:latest
    container_name: lean4web
    restart: always

    # Security settings required for Bubblewrap sandboxing
    # Bubblewrap needs full namespace support to mount /proc inside its sandbox.
    # These settings are required for this to work reliably on Linux.
    # Note: Bubblewrap itself provides sandboxing (no network, isolated PID, read-only fs)
    privileged: true
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN

    expose:
      - "8080"

    environment:
      - NODE_ENV=production
      - PORT=8080
      # Uncomment to disable Bubblewrap sandboxing (NOT recommended for production)
      # - ALLOW_NO_BUBBLEWRAP=true

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 2G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
